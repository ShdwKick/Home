# Главная BurningHouse на burninghouse.ru (apex-домен, без поддомена — см.
# Design/README.md: это дом целиком, а не отдельный сервис), порт 443.
#
# Установка (сертификат уже выпущен):
#   1) sudo cp deploy/nginx-home-443.conf /etc/nginx/sites-available/home
#   2) sudo ln -s /etc/nginx/sites-available/home /etc/nginx/sites-enabled/
#   3) sudo nginx -t && sudo systemctl reload nginx
#   4) sudo ufw allow 443/tcp   # если ещё не открыт
#
# Если сертификат выпускали не certbot --nginx, а certonly (как у остальных
# сервисов), убедитесь, что каталог в /etc/letsencrypt/live/ называется
# именно burninghouse.ru — иначе поправьте пути ssl_certificate* ниже.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name burninghouse.ru;

    ssl_certificate     /etc/letsencrypt/live/burninghouse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/burninghouse.ru/privkey.pem;

    # Статика без загрузок — дефолтного client_max_body_size хватает с запасом.

    location / {
        proxy_pass http://127.0.0.1:8794;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name burninghouse.ru;
    return 301 https://$host$request_uri;
}
