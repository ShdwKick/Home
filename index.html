<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="google-adsense-account" content="ca-pub-4773346307451359">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#150e22">
<title>BurningHouse — сервисы</title>
<meta name="description" content="Мои финансы, «Что смотрим?», «Куда поедем?», «Пораскинем мозгами?» и «Что собираем?» — сервисы BurningHouse в одном месте.">
<link rel="canonical" href="https://burninghouse.ru/">

<!-- Векторный фавикон — основной, PNG рядом для тех, кто SVG не берёт
     (в частности, поисковики для иконки в выдаче обычно хотят растр). -->
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="assets/favicon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180">

<!-- Open Graph / Twitter — без этого ссылка в поиске и при пересылке в
     мессенджеры разворачивается голым текстом, без знака и превью. -->
<meta property="og:type" content="website">
<meta property="og:locale" content="ru_RU">
<meta property="og:url" content="https://burninghouse.ru/">
<meta property="og:site_name" content="BurningHouse">
<meta property="og:title" content="BurningHouse — сервисы">
<meta property="og:description" content="Мои финансы, «Что смотрим?», «Куда поедем?», «Пораскинем мозгами?» и «Что собираем?» — сервисы BurningHouse в одном месте.">
<meta property="og:image" content="https://burninghouse.ru/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="BurningHouse — сервисы">
<meta name="twitter:description" content="Мои финансы, «Что смотрим?», «Куда поедем?», «Пораскинем мозгами?» и «Что собираем?» — сервисы BurningHouse в одном месте.">
<meta name="twitter:image" content="https://burninghouse.ru/assets/og-image.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/brand.css">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<!-- Горящий дом за интерфейсом. Вариант «Очаг»: страница для неспешного
     просмотра, а не редиректа — искры и свечение идут постоянно, см.
     Design/motion.md. -->
<div class="bh-backdrop bh-backdrop--page" aria-hidden="true">
  <div class="bh-layer"><div class="bh-glow"></div></div>
  <div class="bh-layer"><div class="bh-sweep"></div></div>
  <div class="bh-layer"><div class="bh-haze"></div></div>
  <div class="bh-layer bh-sparks" data-bh-sparks="10"></div>
</div>

<div class="topbar">
  <a class="bh-lockup" href="/">
    <svg class="bh-mark" viewBox="0 0 24 24" role="img" aria-label="BurningHouse">
      <defs>
        <linearGradient id="bhFlameHome" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="var(--flame-base, #c2410c)"/>
          <stop offset="1" stop-color="var(--flame-tip, #ffa62b)"/>
        </linearGradient>
      </defs>
      <path class="bh-flame" fill="url(#bhFlameHome)" fill-rule="evenodd"
            d="M12 1.2C13.6 5 16.4 6.6 18.2 9.4C21.4 14.4 18.6 22.4 12 22.4C5.4 22.4 2.6 14.4 5.8 9.4C7.2 7.2 9.2 6 10.2 3.4C10.9 5.6 11.4 6.6 12 7.4C12.4 5.6 12.3 3.4 12 1.2ZM12 9.8 7.4 13.6V19.2H16.6V13.6Z"/>
    </svg>
    <span class="bh-name">BurningHouse</span>
  </a>
  <button class="icon-btn" id="themeBtn" type="button" title="Сменить тему" aria-label="Сменить тему"></button>
</div>

<header class="hero">
  <h1>Мои сервисы</h1>
  <p>Небольшие штуки для дома и для друзей. Выберите карточку, чтобы узнать
    подробнее и перейти.</p>
</header>

<main class="grid" id="cards" aria-label="Сервисы"></main>

<p class="foot">BurningHouse</p>

<!-- Модалка с подробностями сервиса — одна на все карточки, содержимое
     подставляет app.js. -->
<div class="scrim" id="svcScrim">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="svcTitle">
    <div class="dlg-media" id="svcMedia"></div>
    <div class="dlg-body">
      <div class="thumbs" id="svcThumbs"></div>
      <div class="row">
        <span id="svcMarkWrap"></span>
        <h3 id="svcTitle"></h3>
      </div>
      <p class="desc" id="svcDesc"></p>
      <div class="actions">
        <button class="btn outlined" id="svcClose" type="button">Закрыть</button>
        <a class="btn filled" id="svcGo" href="#" target="_blank" rel="noopener">Перейти</a>
      </div>
    </div>
  </div>
</div>

<script src="assets/brand.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
